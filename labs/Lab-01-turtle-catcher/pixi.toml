[workspace]
name = "lab-01-turtle-catcher"
description = "Lab-01-turtle-catcher"
# robostack-jazzy is resolved from anaconda.org (the prefix.dev mirror is equivalent).
channels = ["robostack-jazzy", "conda-forge"]
platforms = ["win-64"]

[dependencies]
python = "3.12.*"
git = "*"
colcon-common-extensions = "*"
ninja = "*"
pytest = "*"
ros-jazzy-desktop = "*"


[tasks]

[tasks.verify]
cmd = "python scripts/verify_install.py"
description = "rclpy pub/sub smoke test"

[tasks.build]
cmd = 'cmd /c scripts\build.bat'
description = "colcon build the workspace (needs MSVC + Windows SDK)"
env = { R2B_BUILD_BASE = 'C:\rb\l01' }

[tasks.test-unit]
cmd = "python -m pytest ws/src -q -p no:cacheprovider"
description = "unit tests (no ROS graph needed)"
env = { PYTHONPATH = "ws/src/turtle_catcher" }

[tasks.ros]
cmd = 'cmd /c scripts\in_ws.bat ros2'
description = "ros2 CLI with this lab's workspace loaded"

[tasks.test-class1]
cmd = 'cmd /c scripts\in_ws.bat python scripts\tests\it_class1.py'
description = "end-to-end test"
env = { PYTHONPATH = "scripts/tests", QT_QPA_PLATFORM = "offscreen" }
