[workspace]
name = "lab-i6-isaac-ramp-imu"
description = "Lab-I6-isaac-ramp-imu"
# robostack-jazzy is resolved from anaconda.org (the prefix.dev mirror is equivalent).
channels = ["robostack-jazzy", "conda-forge"]
platforms = ["win-64"]

[dependencies]
python = "3.12.*"
git = "*"
colcon-common-extensions = "*"
ninja = "*"
pytest = "*"
ros-jazzy-desktop = "*"


[tasks]

[tasks.verify]
cmd = "python scripts/verify_install.py"
description = "rclpy pub/sub smoke test"

[tasks.isaac-install]
cmd = 'powershell -NoProfile -ExecutionPolicy Bypass -File scripts\isaac\ensure_isaac.ps1'
description = "install Isaac Sim 5.1 into C:\\ix unless it is already there (about 10 GB)"

[tasks.isaac-p6]
cmd = 'powershell -NoProfile -ExecutionPolicy Bypass -File scripts\isaac\run_isaac.ps1 isaac\scripts\p6_ramp.py'
description = "Isaac project 6: DiffBot with an IMU in front of a 10 degree ramp (add --gui for a window)"

[tasks.isaac-ros]
cmd = "ros2"
description = "ros2 CLI on the Isaac Sim domain (78), e.g. pixi run isaac-ros topic list"
env = { ROS_DOMAIN_ID = "78", RMW_IMPLEMENTATION = "rmw_fastrtps_cpp" }

[tasks.isaac-ramp]
cmd = 'python isaac\ros_nodes\ramp_climber.py'
description = "climb the ramp and stop on the deck, reading the slope from /imu"
env = { ROS_DOMAIN_ID = "78", RMW_IMPLEMENTATION = "rmw_fastrtps_cpp" }

[tasks.test-isaac-p6]
cmd = 'python scripts\tests\it_isaac_p6.py'
description = "Isaac project 6 end to end (starts a headless Isaac Sim)"
env = { PYTHONPATH = "scripts/tests" }
