[workspace]
name = "lab-03-simulation-odometry"
description = "Lab-03-simulation-odometry"
# robostack-jazzy is resolved from anaconda.org (the prefix.dev mirror is equivalent).
channels = ["robostack-jazzy", "conda-forge"]
platforms = ["win-64"]

[dependencies]
python = "3.12.*"
git = "*"
colcon-common-extensions = "*"
ninja = "*"
pytest = "*"
ros-jazzy-desktop = "*"
ros-jazzy-xacro = "*"
ros-jazzy-joint-state-publisher-gui = "*"
ros-jazzy-tf2-tools = "*"

[tasks]

[tasks.verify]
cmd = "python scripts/verify_install.py"
description = "rclpy pub/sub smoke test"

[tasks.build]
cmd = 'cmd /c scripts\build_py.bat'
description = "colcon build the workspace (pure Python, no compiler needed)"
env = { R2B_BUILD_BASE = 'C:\rb\l03' }

[tasks.build-core]
cmd = 'cmd /c scripts\build_py.bat'
description = "same as build"
env = { R2B_BUILD_BASE = 'C:\rb\l03' }

[tasks.test-unit]
cmd = "python -m pytest ws/src -q -p no:cacheprovider"
description = "unit tests (no ROS graph needed)"
env = { PYTHONPATH = "ws/src/diffbot_description;ws/src/diffbot_sim;ws/src/diffbot_odometry" }

[tasks.ros]
cmd = 'cmd /c scripts\in_ws.bat ros2'
description = "ros2 CLI with this lab's workspace loaded"

[tasks.drive]
cmd = 'cmd /c scripts\in_ws.bat python scripts\drive.py'
description = "drive for a while: pixi run drive 0.2 0.0 4 (m/s, rad/s, seconds)"

[tasks.demo-sim]
cmd = 'cmd /c scripts\in_ws.bat ros2 launch diffbot_bringup sim.launch.py rviz:=true'
description = "simulator + odometry in RViz2"

[tasks.test-class3]
cmd = 'cmd /c scripts\in_ws.bat python scripts\tests\it_class3.py'
description = "end-to-end test"
env = { PYTHONPATH = "scripts/tests" }
