[workspace]
name = "lab-i3-isaac-camera"
description = "Lab-I3-isaac-camera"
# robostack-jazzy is resolved from anaconda.org (the prefix.dev mirror is equivalent).
channels = ["robostack-jazzy", "conda-forge"]
platforms = ["win-64"]

[dependencies]
python = "3.12.*"
git = "*"
colcon-common-extensions = "*"
ninja = "*"
pytest = "*"
ros-jazzy-desktop = "*"


[tasks]

[tasks.verify]
cmd = "python scripts/verify_install.py"
description = "rclpy pub/sub smoke test"

[tasks.isaac-install]
cmd = 'powershell -NoProfile -ExecutionPolicy Bypass -File scripts\isaac\ensure_isaac.ps1'
description = "install Isaac Sim 5.1 into C:\\ix unless it is already there (about 10 GB)"

[tasks.isaac-p3]
cmd = 'powershell -NoProfile -ExecutionPolicy Bypass -File scripts\isaac\run_isaac.ps1 isaac\scripts\p3_camera.py'
description = "Isaac project 3: DiffBot with an RGB + depth camera and a red target cube (add --gui for a window)"

[tasks.isaac-ros]
cmd = "ros2"
description = "ros2 CLI on the Isaac Sim domain (78), e.g. pixi run isaac-ros topic list"
env = { ROS_DOMAIN_ID = "78", RMW_IMPLEMENTATION = "rmw_fastrtps_cpp" }

[tasks.isaac-follower]
cmd = 'python isaac\ros_nodes\color_follower.py'
description = "steer towards the red cube using the camera image"
env = { ROS_DOMAIN_ID = "78", RMW_IMPLEMENTATION = "rmw_fastrtps_cpp" }

[tasks.test-isaac-p3]
cmd = 'python scripts\tests\it_isaac_p3.py'
description = "Isaac project 3 end to end (starts a headless Isaac Sim)"
env = { PYTHONPATH = "scripts/tests" }
