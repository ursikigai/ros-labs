[workspace]
name = "lab-i1-isaac-drive"
description = "Lab-I1-isaac-drive"
# robostack-jazzy is resolved from anaconda.org (the prefix.dev mirror is equivalent).
channels = ["robostack-jazzy", "conda-forge"]
platforms = ["win-64"]

[dependencies]
python = "3.12.*"
git = "*"
colcon-common-extensions = "*"
ninja = "*"
pytest = "*"
ros-jazzy-desktop = "*"


[tasks]

[tasks.verify]
cmd = "python scripts/verify_install.py"
description = "rclpy pub/sub smoke test"

[tasks.isaac-install]
cmd = 'powershell -NoProfile -ExecutionPolicy Bypass -File scripts\isaac\ensure_isaac.ps1'
description = "install Isaac Sim 5.1 into C:\\ix unless it is already there (about 10 GB)"

[tasks.isaac-p1]
cmd = 'powershell -NoProfile -ExecutionPolicy Bypass -File scripts\isaac\run_isaac.ps1 isaac\scripts\p1_drive.py'
description = "Isaac project 1: DiffBot in Isaac Sim driven from ROS 2 (add --gui for a window)"

[tasks.isaac-ros]
cmd = "ros2"
description = "ros2 CLI on the Isaac Sim domain (78), e.g. pixi run isaac-ros topic list"
env = { ROS_DOMAIN_ID = "78", RMW_IMPLEMENTATION = "rmw_fastrtps_cpp" }

[tasks.isaac-drive]
cmd = "python scripts/drive.py"
description = "drive for WALL-CLOCK seconds: pixi run isaac-drive 0.2 0.0 4 (see code/drive_sim.py for sim-time pacing)"
env = { ROS_DOMAIN_ID = "78", RMW_IMPLEMENTATION = "rmw_fastrtps_cpp" }

[tasks.test-isaac-p1]
cmd = 'python scripts\tests\it_isaac_p1.py'
description = "Isaac project 1 end to end (starts a headless Isaac Sim)"
env = { PYTHONPATH = "scripts/tests" }
